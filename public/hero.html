<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Feynman Gap Finder</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&family=Manrope:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
      overflow: hidden;
      background: #f6f8f4;
    }

    :root {
      --paper: #f6f8f4;
      --ink: #16231b;
      --ink-soft: rgba(22, 35, 27, 0.72);
      --ink-dim: rgba(22, 35, 27, 0.52);
      --accent: #2f5d43;
      --cream: #f6f8f4;
    }

    .bg-video {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      z-index: 0;
      background: var(--paper);
    }

    .scrim {
      position: fixed;
      inset: 0;
      z-index: 1;
      pointer-events: none;
      background:
        radial-gradient(ellipse 70% 55% at 50% 42%, rgba(246, 248, 244, 0.72) 0%, rgba(246, 248, 244, 0.28) 55%, transparent 78%),
        linear-gradient(180deg, rgba(246, 248, 244, 0.55) 0%, rgba(246, 248, 244, 0.38) 45%, rgba(246, 248, 244, 0.62) 100%);
    }

    .blur-mask {
      position: fixed;
      inset: 0;
      z-index: 2;
      pointer-events: none;
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      mask-image: linear-gradient(to top, black 0%, black 18%, transparent 42%);
      -webkit-mask-image: linear-gradient(to top, black 0%, black 18%, transparent 42%);
    }

    .shell {
      position: relative;
      z-index: 10;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .hero {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 0 32px 44px;
    }

    .kicker {
      display: inline-flex;
      align-items: center;
      gap: 0.55rem;
      padding: 0.45rem 0.85rem;
      margin-bottom: 1.35rem;
      border: 1px solid rgba(47, 93, 67, 0.22);
      border-radius: 999px;
      background: rgba(246, 248, 244, 0.55);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      font-family: "JetBrains Mono", ui-monospace, monospace;
      font-size: 0.62rem;
      font-weight: 500;
      letter-spacing: 0.34em;
      text-transform: uppercase;
      color: var(--accent);
      opacity: 0;
      animation: blurFadeUp 1s cubic-bezier(0.2, 0.7, 0.2, 1) 200ms forwards;
    }

    .kicker-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--accent);
      flex-shrink: 0;
    }

    h1 {
      font-family: Manrope, ui-sans-serif, system-ui, sans-serif;
      font-weight: 700;
      font-size: clamp(3.5rem, 7.8vw, 6.25rem);
      line-height: 0.96;
      letter-spacing: -0.03em;
      color: var(--ink);
      max-width: 14ch;
      text-shadow: 0 1px 0 rgba(246, 248, 244, 0.85), 0 8px 32px rgba(246, 248, 244, 0.45);
      opacity: 0;
      animation: blurFadeUp 1s cubic-bezier(0.2, 0.7, 0.2, 1) 340ms forwards;
    }

    .sub {
      margin-top: 1.35rem;
      max-width: 530px;
      font-family: Inter, ui-sans-serif, system-ui, sans-serif;
      font-weight: 400;
      font-size: clamp(1rem, 1.6vw, 1.25rem);
      line-height: 1.55;
      color: var(--ink-soft);
      opacity: 0;
      animation: blurFadeUp 1s cubic-bezier(0.2, 0.7, 0.2, 1) 500ms forwards;
    }

    .cta-row {
      margin-top: 2rem;
      opacity: 0;
      animation: blurFadeUp 1s cubic-bezier(0.2, 0.7, 0.2, 1) 660ms forwards;
    }

    .cta-stack {
      position: relative;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 3.1rem;
      min-width: 13.25rem;
    }

    .cta-pill {
      display: inline-flex;
      align-items: center;
      gap: 0.45rem;
      padding: 0.85rem 1.65rem;
      border: none;
      border-radius: 999px;
      background: var(--accent);
      color: var(--cream);
      font-family: Manrope, ui-sans-serif, system-ui, sans-serif;
      font-size: 0.9375rem;
      font-weight: 600;
      text-decoration: none;
      letter-spacing: 0.01em;
      white-space: nowrap;
      cursor: pointer;
      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, 0.14),
        0 10px 28px rgba(47, 93, 67, 0.28);
      transition: transform 0.2s ease, background 0.2s ease, box-shadow 0.2s ease, opacity 0.35s ease, filter 0.35s ease;
    }

    .cta-pill:hover {
      transform: translateY(-2px);
      background: #376b4e;
      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, 0.18),
        0 14px 34px rgba(47, 93, 67, 0.34);
    }

    .cta-pill svg {
      width: 16px;
      height: 16px;
      transition: transform 0.2s ease;
    }

    .cta-pill:hover svg {
      transform: translateX(2px);
    }

    .cta-begin.is-out {
      opacity: 0;
      filter: blur(8px);
      transform: translateY(-12px);
      pointer-events: none;
    }

    .cta-create {
      position: absolute;
      display: none;
    }

    .cta-create.is-visible {
      display: inline-flex;
      opacity: 0;
      filter: blur(20px);
      transform: translateY(36px);
      animation: blurFadeUp 1s cubic-bezier(0.2, 0.7, 0.2, 1) forwards;
    }

    .footer {
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.85rem;
      padding: 0 48px 30px;
      opacity: 0;
      animation: blurFadeUp 1s cubic-bezier(0.2, 0.7, 0.2, 1) 900ms forwards;
    }

    .footer-rule {
      width: 26px;
      height: 1px;
      background: rgba(22, 35, 27, 0.22);
    }

    .footer-tag {
      font-family: "JetBrains Mono", ui-monospace, monospace;
      font-size: 0.58rem;
      font-weight: 500;
      letter-spacing: 0.3em;
      text-transform: uppercase;
      color: var(--ink-dim);
      white-space: nowrap;
    }

    @keyframes blurFadeUp {
      from {
        opacity: 0;
        filter: blur(20px);
        transform: translateY(36px);
      }
      to {
        opacity: 1;
        filter: blur(0);
        transform: translateY(0);
      }
    }

    @media (max-width: 600px) {
      .hero {
        padding: 0 20px 32px;
      }

      .footer {
        padding: 0 20px 22px;
      }

      .footer-tag {
        font-size: 0.5rem;
        letter-spacing: 0.22em;
        white-space: normal;
        text-align: center;
        max-width: 16rem;
      }

      .kicker {
        font-size: 0.54rem;
        letter-spacing: 0.28em;
      }

      .cta-stack {
        min-width: 12rem;
      }

      .cta-pill {
        font-size: 0.875rem;
        padding: 0.8rem 1.5rem;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .kicker,
      h1,
      .sub,
      .cta-row,
      .footer {
        animation: none;
        opacity: 1;
        filter: none;
        transform: none;
      }

      .cta-create.is-visible {
        animation: none;
        opacity: 1;
        filter: none;
        transform: none;
      }
    }
  </style>
</head>
<body>
  <video
    class="bg-video"
    src="https://zxdefgavgwfxastwmmjm.supabase.co/storage/v1/object/public/assets/stillwater.mp4"
    autoplay
    muted
    loop
    playsinline
  ></video>

  <div class="scrim" aria-hidden="true"></div>
  <div class="blur-mask" aria-hidden="true"></div>

  <div class="shell">
    <main class="hero">
      <p class="kicker"><span class="kicker-dot" aria-hidden="true"></span>Explain it. Find the gap.</p>
      <h1>If you can't explain it, you don't understand it.</h1>
      <p class="sub">Explain any topic in your own words. AI finds exactly where your understanding breaks — then helps you close the gap.</p>
      <div class="cta-row">
        <div class="cta-stack">
          <button type="button" class="cta-pill cta-begin" id="cta-begin">
            Begin
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
          </button>
          <a href="/app" class="cta-pill cta-create" id="cta-create" hidden>
            Create an app
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
          </a>
        </div>
      </div>
    </main>

    <footer class="footer">
      <span class="footer-rule" aria-hidden="true"></span>
      <span class="footer-tag">Feynman Gap Finder — Understand, don't memorize</span>
      <span class="footer-rule" aria-hidden="true"></span>
    </footer>
  </div>

  <script>
    (function () {
      var video = document.querySelector('.bg-video');
      if (video) {
        function tryPlay() {
          var p = video.play();
          if (p && typeof p.catch === 'function') p.catch(function () {});
        }
        video.addEventListener('canplay', tryPlay);
        window.addEventListener('load', tryPlay);
      }

      var beginBtn = document.getElementById('cta-begin');
      var createLink = document.getElementById('cta-create');
      if (!beginBtn || !createLink) return;

      beginBtn.addEventListener('click', function () {
        if (beginBtn.classList.contains('is-out')) return;
        beginBtn.classList.add('is-out');
        createLink.hidden = false;
        createLink.classList.add('is-visible');
      });
    })();
  </script>
</body>
</html>
